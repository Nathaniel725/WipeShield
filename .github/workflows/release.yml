name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: SKIP_DEPLOY=1 ./scripts/build.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' WipeShield.app/Contents/Info.plist)"
          fi
          ditto -c -k --sequesterRsrc --keepParent WipeShield.app "WipeShield-${VERSION}-universal.zip"
          shasum -a 256 "WipeShield-${VERSION}-universal.zip" > "WipeShield-${VERSION}-universal.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WipeShield-universal
          path: |
            WipeShield-*-universal.zip
            WipeShield-*-universal.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WipeShield-*-universal.zip
            WipeShield-*-universal.zip.sha256
          body: |
            **WipeShield ${{ github.ref_name }}**

            Universal binary (Apple Silicon + Intel), macOS 10.15+.

            Download `WipeShield-*-universal.zip`, unzip, drag **WipeShield.app** to `/Applications`.
            First launch: right-click the app → **Open** (no Developer ID signature yet), then grant the
            **Accessibility** permission when prompted. See the README for details.
